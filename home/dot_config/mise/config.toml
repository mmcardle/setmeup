[tools]
python = "latest"
node = "lts"
go = "latest"
rust = "latest"
jq = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
uv = "latest"
bat = "latest"
eza = "latest"
lazygit = "latest"
gh = "latest"
direnv = "latest"
"aqua:joshmedeski/sesh" = "latest"
"ubi:max-sixty/worktrunk" = { version = "latest", exe = "wt" }
glow = "latest"
zoxide = "latest"
delta = "latest"
bun = "latest"
"github:modem-dev/hunk" = "latest"
# Native binary. Not the npm package: mise installs npm packages without
# running their postinstall scripts, and the npm package only works after its
# postinstall copies the real binary into place.
"aqua:anthropics/claude-code" = "latest"
"npm:@openai/codex" = "latest"
"npm:opencode-ai" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:opensrc" = "latest"

[settings]
experimental = true

[settings.python]
precompiled_flavor = "install_only"

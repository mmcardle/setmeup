[tools]
python = "latest"
node = "lts"
go = "latest"
rust = "latest"
jq = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
uv = "latest"
bat = "latest"
eza = "latest"
lazygit = "latest"
gh = "latest"
direnv = "latest"
"aqua:joshmedeski/sesh" = "latest"
"ubi:max-sixty/worktrunk" = { version = "latest", exe = "wt" }
glow = "latest"
zoxide = "latest"
delta = "latest"
bun = "latest"
"github:modem-dev/hunk" = "latest"
# Coding agents come from their native release binaries, not npm. mise
# installs npm packages without running postinstall scripts, and the Claude
# Code and opencode npm packages only work after theirs copies the real binary
# into place. Native installs also skip the Node wrapper and dependency tree.
"aqua:anthropics/claude-code" = "latest"
"aqua:openai/codex" = "latest"
"aqua:anomalyco/opencode" = "latest"
"github:earendil-works/pi" = "latest"
"npm:opensrc" = "latest"

[settings]
experimental = true

[settings.python]
precompiled_flavor = "install_only"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'

# --- General settings ---
setw -g mouse on
setw -g mode-keys vi
set -gq allow-passthrough on
set -g default-terminal "tmux-256color"
# Pass 24-bit truecolor (RGB) through to the outer terminal. Without this,
# tmux approximates RGB backgrounds in 256 colors and highlight fills render
# ragged under truecolor terminals like Ghostty.
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# history-limit is capped (not maximised) on purpose: copy-mode is disabled
# below as a crash workaround (see TMUX_BUG.md), so a huge grid is just memory
# the upstream bug can corrupt. This is now memory hygiene plus the cap on how
# much prefix-S can dump. Raise it freely once upstream is fixed.
set -g history-limit 50000
set -g status-interval 5
set -s escape-time 0
set -g status-position top
setw -g monitor-activity on
set -g visual-activity on
set-option -g focus-events on
set -g detach-on-destroy off

# --- Prefix ---
unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

# --- Pane management ---
bind-key x kill-pane
bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind | split-window -h
bind - split-window -v
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind N switch-client -l
bind-key -T prefix l send-keys -R C-l \; clear-history

# --- Copy mode ---
# NOTE: `bind Escape copy-mode` is intentionally absent — it was the last
# explicit key into the crashing copy-mode path. See TMUX_BUG.md and the
# "Disable copy-mode entry" block at the end of this file.
unbind [
bind -T copy-mode-vi v send -X begin-selection
bind P paste-buffer

# --- Plugin settings ---
set -g @continuum-restore 'on'
set -g @t-fzf-prompt '  '
set-option -g status-right ""

# --- Sesh session switcher ---
unbind-key -T prefix s
bind-key "s" run-shell '~/.config/setmeup/sesh-popup.sh'
bind-key "n" display-popup -E -w 80% -h 50% "~/.config/setmeup/new-ticket.sh"
unbind-key -T prefix m
bind-key "m" display-popup -E -w 80% -h 80% "~/.config/setmeup/checkout-ticket.sh"

# --- Shell popup (self-dismissing) ---
unbind-key -T prefix o
bind-key "o" display-popup -E -w 80% -h 80%

# --- Scratch zsh popup ---
bind-key "g" display-popup -E -w 80% -h 80% "zsh"

# --- Scrollback without copy-mode (workaround for tmux/tmux#4962) ---
# Copy-mode on macOS arm64 hits a libmalloc double-free in
# grid_free_line and crashes the tmux server, losing every session.
# See TMUX_BUG.md. Until upstream fixes it, prefix-S dumps the pane's
# scrollback to a per-pane tmpfile and opens it read-only in vim,
# avoiding the crashing code path entirely.
bind-key "S" run-shell 'tmux capture-pane -t "#{pane_id}" -p -S - > /tmp/tmux-scrollback.#{pane_id} && tmux split-window -v "vim -R +$ /tmp/tmux-scrollback.#{pane_id}"'

# --- Initialize TPM (must be last) ---
run '~/.tmux/plugins/tpm/tpm'

# --- Claude waiting indicator (prepended to tokyo-night status-right) ---
# Overrides status-right AFTER TPM loads tokyo-night so the indicator sits
# on the left of the existing render. Pruning happens inside the status
# script so stale flags don't haunt the bar after a Claude is killed.
set-option -g status-right "#(~/.local/bin/claude-waiting-status.sh)#(~/.tmux/plugins/tmux-tokyo-night/bin/powerkit-render right)"
set-option -g status-interval 2

# --- Disable copy-mode entry (workaround for tmux/tmux#4777 / #4962) ---
# Entering copy-mode clones the pane grid and hits a double-free that aborts the
# whole tmux server on macOS arm64, losing every session (see TMUX_BUG.md).
# `mouse on` is kept so events still forward to mouse-aware fullscreen apps
# (vim / less / htop via `send -M`); in a plain shell pane the wheel/drag/click
# now does nothing instead of entering copy-mode. Placed after TPM so no plugin
# re-binds these. The default bindings each fall back to copy-mode -e/-M/-H;
# here the fallback is dropped entirely.
bind -n WheelUpPane      if -F '#{||:#{alternate_on},#{mouse_any_flag}}' { send -M }
bind -n MouseDrag1Pane   if -F '#{||:#{alternate_on},#{mouse_any_flag}}' { send -M }
bind -n DoubleClick1Pane if -F '#{||:#{alternate_on},#{mouse_any_flag}}' { send -M }
bind -n TripleClick1Pane if -F '#{||:#{alternate_on},#{mouse_any_flag}}' { send -M }
# Scrollbar (3.6+) and right-click menu copy-mode routes have no safe forward,
# so neutralise them outright.
unbind -n MouseDown1ScrollbarUp
unbind -n MouseDown1ScrollbarDown
unbind -n MouseDrag1ScrollbarSlider
unbind -n MouseDown3Pane
